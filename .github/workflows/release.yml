# Builds, tests and publishes AutoApplicator.dmg when a version tag (v1.0.0, …) is pushed. Run it by hand to get the
# disk image as a downloadable artifact without publishing. Public builds never include a cloud browser address.
# Releases need Xcode 27 or newer. Until GitHub's Mac images have it, the run stops before building and the release
# is built on a Mac instead (README › Releases).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # Apple silicon, GitHub's newest image (a new Xcode arrives there first). Its machines are often busy: a job that
    # gets none within 15 minutes fails unstarted and can simply be re-run.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count

      - name: Use Xcode 27 or newer
        run: |
          # An Xcode 26 SDK builds a weaker app (see AppleModel.swift), so stop rather than publish one.
          XCODE=$(ls -d /Applications/Xcode_2[7-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::This runner image has no Xcode 27 yet. Build the release on a Mac instead (README › Releases)."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Test
        run: |
          swift build --product AutoApplicator
          swift test --skip LiveAITests --skip 'Cloud'

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"

      - name: Build the disk image
        env:
          AA_CLOUD_CONFIG: none
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AutoApplicator-dmg
          path: dist/AutoApplicator.dmg

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" dist/AutoApplicator.dmg --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/AutoApplicator.dmg --title "Auto Applicator ${GITHUB_REF_NAME#v}" --generate-notes
