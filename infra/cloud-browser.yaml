AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Auto Applicator cloud browser. A managed Chrome (Amazon Bedrock AgentCore Browser) the app can drive instead of
  its built-in browser, plus an invite-only sign-in (password, passkey, Google or Apple) that hands the app
  short-lived AWS credentials allowed to do nothing but use that browser and ask its cloud AI (a model on Amazon
  Bedrock, for form questions the on-device AI couldn't answer). Idle cost is zero: the browser is billed only while a
  session runs, the AI only per question.

Parameters:
  DomainPrefix:
    Type: String
    Description: Sign-in page address prefix (<prefix>.auth.<region>.amazoncognito.com). Must be unique in the region.
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  # scripts/deploy_cloud.sh creates the Google and Apple providers itself (their secrets never pass through
  # CloudFormation) and then turns these on to offer them on the sign-in page.
  GoogleSignIn:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  AppleSignIn:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  AppTag:
    Type: String
    Default: auto-applicator
    Description: Value of the "App" tag every resource carries; the resource group collects resources by it.
  SignInDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: How long a sign-in lasts before the app asks again.
  HelperModel:
    Type: String
    # Amazon's own model works in every account. Claude (us.anthropic.claude-sonnet-4-6) is stronger but needs
    # Anthropic's one-time use-case form in the Bedrock console first; other providers need their Marketplace offer
    # accepted once.
    Default: us.amazon.nova-2-lite-v1:0
    AllowedPattern: "^us\\.[a-z0-9-]+\\.[a-z0-9.:-]+$"
    Description: >-
      The cloud AI: a US cross-region inference profile (us.<provider>.<model>) that supports tool use. The app asks it
      only about form questions the on-device AI couldn't answer.

Conditions:
  HasGoogle: !Equals [!Ref GoogleSignIn, "true"]
  HasApple: !Equals [!Ref AppleSignIn, "true"]
  HasBoth: !And [!Condition HasGoogle, !Condition HasApple]
  HasSocial: !Or [!Condition HasGoogle, !Condition HasApple]

Resources:
  # ---- Sign-in -------------------------------------------------------------------------------------------------
  Users:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: auto-applicator-users
      UserPoolTier: ESSENTIALS            # passkeys need Essentials or Plus
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        # No public sign-up: people are invited by scripts/deploy_cloud.sh. A first Google or Apple sign-in would
        # still create an account, so InviteGate only lets those join an invitation.
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your Auto Applicator cloud sign-in
          EmailMessage: !If
            - HasSocial
            - !Sub
              - >-
                You're invited to the Auto Applicator cloud browser. In the app, open Settings → Cloud browser and
                choose Sign in. Continue with ${Providers} using this address ({username}), or sign in with it and
                this temporary password: {####} — you'll choose your own password and can add a passkey right after.
              - Providers: !If [HasBoth, "Google or Apple", !If [HasGoogle, "Google", "Apple"]]
            - >-
              You're invited to the Auto Applicator cloud browser. In the app, open Settings → Cloud browser and
              sign in with {username} and this temporary password: {####} — you'll choose your own password and can
              add a passkey right after.
      LambdaConfig:
        PreSignUp: !GetAtt InviteGate.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
        SignInPolicy:
          AllowedFirstAuthFactors: [PASSWORD, WEB_AUTHN]
      # Passkeys are bound to the sign-in domain (the default relying party). Touch ID / device password every time.
      WebAuthnUserVerification: required
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        App: !Ref AppTag

  SignInDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref Users
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2              # the hosted pages that support passkeys

  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: auto-applicator-mac
      UserPoolId: !Ref Users
      GenerateSecret: false               # a desktop app can't keep a secret: authorization code + PKCE instead
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, aws.cognito.signin.user.admin]
      CallbackURLs: ["autoapplicator://auth"]
      LogoutURLs: ["autoapplicator://signed-out"]
      SupportedIdentityProviders:
        - COGNITO
        - !If [HasGoogle, Google, !Ref AWS::NoValue]
        - !If [HasApple, SignInWithApple, !Ref AWS::NoValue]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: !Ref SignInDays
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  SignInBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref Users
      ClientId: !Ref AppClient
      UseCognitoProvidedValues: true

  # ---- Invite-only, also for Google and Apple ------------------------------------------------------------------
  # Runs before Cognito creates an account. Invitations (made by an administrator) pass. A first Google or Apple
  # sign-in passes only if its verified email matches an invitation, and is then joined to that invited account;
  # anything else, including an error here, is refused.
  InviteGate:
    Type: AWS::Lambda::Function
    DependsOn: InviteGateLogs
    Properties:
      FunctionName: auto-applicator-invite-gate
      Description: Lets a Google or Apple sign-in in only if its email address was invited.
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt InviteGateRole.Arn
      Code:
        ZipFile: |
          import boto3

          cognito = boto3.client("cognito-idp")
          NAMES = {"Google": "Google", "SignInWithApple": "Apple"}


          def handler(event, context):
              if event["triggerSource"] != "PreSignUp_ExternalProvider":
                  return event  # an invitation itself
              provider, _, subject = event["userName"].partition("_")
              name = NAMES.get(provider, provider)
              attrs = event["request"]["userAttributes"]
              email = attrs.get("email", "").strip().lower()
              if not email or str(attrs.get("email_verified", "")).lower() != "true" or '"' in email or "\\" in email:
                  raise Exception(f"{name} didn't share a verified email address, so it can't be matched to an invitation.")
              pool = event["userPoolId"]
              users = cognito.list_users(UserPoolId=pool, Filter=f'email = "{email}"')["Users"]
              invited = [u for u in users if u["UserStatus"] != "EXTERNAL_PROVIDER" and u["Enabled"]
                         and {"Name": "email_verified", "Value": "true"} in u["Attributes"]]
              if not invited:
                  print(f"refused: {name} sign-in without an invitation")
                  if email.endswith("@privaterelay.appleid.com"):
                      raise Exception("Apple shared a Hide My Email address, which has no invitation. Sign in with your invited address instead.")
                  raise Exception("The Auto Applicator cloud browser is invite-only, and this address has no invitation.")
              cognito.admin_link_provider_for_user(
                  UserPoolId=pool,
                  DestinationUser={"ProviderName": "Cognito", "ProviderAttributeValue": invited[0]["Username"]},
                  SourceUser={"ProviderName": provider, "ProviderAttributeName": "Cognito_Subject",
                              "ProviderAttributeValue": subject},
              )
              print(f"joined: {name} sign-in to its invitation")
              return event
      Tags:
        - Key: App
          Value: !Ref AppTag

  InviteGateLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/auto-applicator-invite-gate
      RetentionInDays: 30
      Tags:
        - Key: App
          Value: !Ref AppTag

  InviteGateRole:
    Type: AWS::IAM::Role
    Properties:
      Description: "Auto Applicator invite gate: write its log, and (InviteGatePolicy) find and join invited accounts."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: write-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt InviteGateLogs.Arn
      Tags:
        - Key: App
          Value: !Ref AppTag

  # Separate from the role: the pool names the function, so the role can't name the pool without a cycle.
  InviteGatePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref InviteGateRole
      PolicyName: match-invitations
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [cognito-idp:ListUsers, cognito-idp:AdminLinkProviderForUser]
            Resource: !GetAtt Users.Arn

  InviteGatePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InviteGate
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt Users.Arn
      SourceAccount: !Ref AWS::AccountId

  # ---- Signed-in user → short-lived AWS credentials --------------------------------------------------------------
  Identities:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: auto_applicator_identities
      AllowUnauthenticatedIdentities: false
      AllowClassicFlow: false
      CognitoIdentityProviders:
        - ClientId: !Ref AppClient
          ProviderName: !GetAtt Users.ProviderName
          ServerSideTokenCheck: true      # a revoked sign-in stops getting credentials at once
      IdentityPoolTags:
        - Key: App
          Value: !Ref AppTag

  BrowserUserRole:
    Type: AWS::IAM::Role
    Properties:
      Description: "What a signed-in Auto Applicator user may do: use the cloud browser and ask its cloud AI, nothing else."
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: cognito-identity.amazonaws.com }
            Action: [sts:AssumeRoleWithWebIdentity, sts:TagSession]
            Condition:
              StringEquals: { "cognito-identity.amazonaws.com:aud": !Ref Identities }
              ForAnyValue:StringLike: { "cognito-identity.amazonaws.com:amr": authenticated }
      Policies:
        - PolicyName: use-cloud-browser
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Sessions
                Effect: Allow
                Action:
                  - bedrock-agentcore:StartBrowserSession
                  - bedrock-agentcore:SaveBrowserSessionProfile
                Resource: [!GetAtt Browser.BrowserArn, !GetAtt BrowserProfile.ProfileArn]
              - Sid: SessionControl
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetBrowserSession
                  - bedrock-agentcore:StopBrowserSession
                  - bedrock-agentcore:UpdateBrowserStream
                Resource: !GetAtt Browser.BrowserArn
              - Sid: Streams              # these actions have no resource type; a session id is still required
                Effect: Allow
                Action:
                  - bedrock-agentcore:ConnectBrowserAutomationStream
                  - bedrock-agentcore:ConnectBrowserLiveViewStream
                  - bedrock-agentcore:ListBrowserSessions
                Resource: "*"
              - Sid: CloudAI              # through the function only: never Bedrock itself
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FormHelper.Arn
      Tags:
        - Key: App
          Value: !Ref AppTag

  IdentityRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref Identities
      Roles:
        authenticated: !GetAtt BrowserUserRole.Arn

  # ---- The browser ---------------------------------------------------------------------------------------------
  Browser:
    Type: AWS::BedrockAgentCore::BrowserCustom
    Properties:
      Name: auto_applicator_browser
      Description: Chrome the Auto Applicator app drives when "Use the cloud browser" is on.
      NetworkConfiguration:
        NetworkMode: PUBLIC
      RecordingConfig:
        Enabled: false                    # application forms hold personal details: nothing is recorded
      Tags:
        App: !Ref AppTag

  BrowserProfile:
    Type: AWS::BedrockAgentCore::BrowserProfile
    Properties:
      Name: auto_applicator_profile
      Description: Cookies kept between cloud sessions (stay signed in to LinkedIn and company sites).
      Tags:
        App: !Ref AppTag

  # ---- The cloud AI ---------------------------------------------------------------------------------------------
  # A stronger model for the few form questions the on-device AI can't answer. Only a signed-in user's credentials
  # (BrowserUserRole) may call this function, and the function may call only the one model, with a fixed answer
  # shape and size. Prompts carry the candidate's details, so nothing logs them: the function logs token counts,
  # and Bedrock's model invocation logging stays off.
  FormHelper:
    Type: AWS::Lambda::Function
    DependsOn: FormHelperLogs
    Properties:
      FunctionName: auto-applicator-form-helper
      Description: Answers the form questions the app's on-device AI couldn't, with a model on Amazon Bedrock.
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 120
      ReservedConcurrentExecutions: 2     # one run asks one question at a time; this also caps the spend
      Role: !GetAtt FormHelperRole.Arn
      Environment:
        Variables:
          MODEL: !Ref HelperModel
      Code:
        ZipFile: |
          import json
          import os

          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          MODEL = os.environ["MODEL"]
          NOVA2 = ".amazon.nova-2" in MODEL  # thinks before answering; Claude can't while it must answer with the tool
          bedrock = boto3.client("bedrock-runtime", config=Config(read_timeout=110, retries={"max_attempts": 4, "mode": "adaptive"}))


          def handler(event, context):
              system, prompt, schema = event.get("system"), event.get("prompt"), event.get("schema")
              if not (isinstance(system, str) and isinstance(prompt, str) and isinstance(schema, dict) and schema.get("type") == "object"):
                  return {"error": "bad request"}
              if len(system) > 8000 or len(prompt) > 60000 or len(json.dumps(schema)) > 60000:
                  return {"error": "too long"}
              request = dict(
                  modelId=MODEL,
                  system=[{"text": system}],
                  messages=[{"role": "user", "content": [{"text": prompt}]}],
                  # Nova 2's thinking counts toward its limit: 4000 cut off four answers in ten.
                  inferenceConfig={"maxTokens": 10000} if NOVA2 else {"maxTokens": 3000, "temperature": 0},
                  toolConfig={"tools": [{"toolSpec": {"name": "answer", "description": "Records the answer to every field.",
                                                      "inputSchema": {"json": schema}}}],
                              "toolChoice": {"tool": {"name": "answer"}}},
              )
              if NOVA2:
                  request["additionalModelRequestFields"] = {"reasoningConfig": {"type": "enabled", "maxReasoningEffort": "low"}}
              try:
                  try:
                      r = bedrock.converse(**request)
                  except ClientError as e:
                      if "temperature" not in e.response["Error"].get("Message", ""):
                          raise
                      del request["inferenceConfig"]["temperature"]  # a model that sets its own
                      r = bedrock.converse(**request)
              except ClientError as e:
                  code, message = e.response["Error"]["Code"], e.response["Error"].get("Message", "")
                  print(json.dumps({"error": code, "message": message[:200]}))  # never the request: it holds personal details
                  if code == "ValidationException" and "too long" in message.lower():
                      return {"error": "too long"}
                  return {"error": "busy" if code in ("ThrottlingException", "ServiceUnavailableException") else code}
              usage = r.get("usage", {})
              print(json.dumps({"stop": r["stopReason"], "in": usage.get("inputTokens"), "out": usage.get("outputTokens")}))
              if r["stopReason"] == "max_tokens":
                  return {"error": "answer cut off"}
              for block in r["output"]["message"]["content"]:
                  if "toolUse" in block:
                      return {"answer": block["toolUse"]["input"], "model": MODEL}
              return {"error": "no answer"}
      Tags:
        - Key: App
          Value: !Ref AppTag

  FormHelperLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/auto-applicator-form-helper
      RetentionInDays: 30
      Tags:
        - Key: App
          Value: !Ref AppTag

  FormHelperRole:
    Type: AWS::IAM::Role
    Properties:
      Description: "Auto Applicator cloud AI: write its log and ask the one model, nothing else."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: write-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt FormHelperLogs.Arn
        - PolicyName: ask-model
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Profile
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${HelperModel}"
              - Sid: ModelThroughProfile  # the US regions the profile routes to, and only through it
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub
                  - "arn:${AWS::Partition}:bedrock:us-*::foundation-model/${Model}"
                  - Model: !Select [1, !Split ["us.", !Ref HelperModel]]
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${HelperModel}"
      Tags:
        - Key: App
          Value: !Ref AppTag

  # ---- Everything above, in one place in the console -----------------------------------------------------------
  AppResources:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: auto-applicator
      Description: Everything the Auto Applicator cloud browser and its cloud AI use.
      ResourceQuery:
        Type: TAG_FILTERS_1_0
        Query:
          ResourceTypeFilters: [AWS::AllSupported]
          TagFilters:
            - Key: App
              Values: [!Ref AppTag]
      Tags:
        - Key: App
          Value: !Ref AppTag

Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref Users
  ClientId:
    Value: !Ref AppClient
  SignInHost:
    Value: !Sub "${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  IdentityPoolId:
    Value: !Ref Identities
  BrowserId:
    Value: !GetAtt Browser.BrowserId
  BrowserProfileId:
    Value: !GetAtt BrowserProfile.ProfileId
  ResourceGroup:
    Value: !Ref AppResources
  HelperFunction:
    Value: !Ref FormHelper
  HelperModel:
    Value: !Ref HelperModel
