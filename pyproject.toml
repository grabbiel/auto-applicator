[project]
name = "auto-applicator"
version = "0.3.0"
description = "Local job-application assistant: LinkedIn search, ATS form filling with a local LLM, email OTP handling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pillow>=10.4",
    "pypdf>=5.0",
    "rich>=13.8",
]

[project.scripts]
auto-applicator = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: needs the Playwright Chromium build (uv run playwright install chromium)",
    "live_llm: needs a running Ollama server with the configured model pulled",
]
